adnav_driver:
  ros__parameters:
    log_path: "~/.ros/log/"
    comm_select: 0
    baud_rate: 115200
    com_port: serial/by-id/usb-FTDI_USB_HS_SERIAL_CONVERTER_FTRTKA7O-if00-port0
    publish_us: 20000

    # Packet 20 supplies filtered INS/GNSS state. Packet 28 supplies raw
    # sensors for observation and logging, but is not fused initially.
    packet_request: [20, 50, 28, 50]
    packet_timer_period: 1000

    # The device stores 'internal GNSS enabled' in its Filter Options and it was found
    # disabled, which keeps the navigation filter uninitialised (position = Sydney).
    # Enforce it at every start (non-permanent write).
    internal_gnss_enabled: 1
