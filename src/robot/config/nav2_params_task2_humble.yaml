# nav2_params_task2.yaml
# Task 2 uses Jetson MPPI for avoidance and sends its path directly to
# FollowPath.  The miniPC runs only the controller and velocity smoother;
# it deliberately does not apply a LiDAR Collision Monitor stop layer.

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 60.0

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Task 2 cruise target: 2.0 kn = 1.028888... m/s. Curvature and final
      # approach regulation below may intentionally reduce this command.
      desired_linear_vel: 1.0288888888888889
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 6.0
      lookahead_dist: 3.0
      min_lookahead_dist: 1.5
      max_lookahead_dist: 8.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      use_rotate_to_heading: false
      allow_reversing: false
      max_angular_accel: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.1
      use_cost_regulated_linear_velocity_scaling: false
      use_collision_detection: false
      transform_tolerance: 0.3
      # Match the final smoother so neither layer introduces an extra ramp.
      max_linear_accel: 0.5

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.6

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.1
      robot_radius: 0.35
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 1.2

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    feedback: "OPEN_LOOP"
    # Keep 2.2 kn headroom above FollowPath's 2.0 kn cruise request.
    max_velocity: [1.1317777777777778, 0.5, 1.0]
    min_velocity: [-0.4, -0.5, -1.0]
    max_accel: [0.5, 0.5, 1.0]
    max_decel: [-0.5, -0.5, -1.0]
    odom_topic: "odom"
