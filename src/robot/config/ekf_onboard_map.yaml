ekf_onboard_map:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map
    # Global correction only; never feed this pose back to the local filter.
    odom0: /localization/gnss_map
    odom0_config: [true, true, false, false, false, false, false, false, false, false, false, false, false, false, false]
    odom0_queue_size: 10
    odom0_pose_rejection_threshold: 5.0
    odom1: /odometry/filtered/local
    odom1_config: [false, false, false, false, false, false, true, true, false, false, false, true, false, false, false]
    odom1_queue_size: 20
    imu0: /localization/gnss_heading_imu
    imu0_config: [false, false, false, false, false, true, false, false, false, false, false, false, false, false, false]
    imu0_queue_size: 10
    imu0_pose_rejection_threshold: 5.0
