task1_orchestrator:
  ros__parameters:
    frame_id: "map"

    # Surveyed Task 1 geometry from "GPS points for tasks.xlsx", converted
    # to local ENU metres with GPS1 (63.4408000000, 10.4233194444) as map
    # (0, 0). The checkpoints are GPS1 -> GPS2 -> GPS3 -> GPS4.
    gps_checkpoint_xy: "[[0.000, 0.000], [-27.099, -29.685], [5.403, -42.969], [23.089, -3.401]]"
    waypoint1_xy: "[[-8.434, -3.711], [-5.807, -11.132], [-4.977, -19.481], [-20.739, -18.862]]"
    waypoint2_xy: "[[-0.830, -25.047], [10.231, -28.758], [17.598, -17.922]]"

    # Buoys in task1monday.kmz: red, east, west, green. Cardinal directions
    # are evaluated against geographic north (+Y in this ENU map).
    buoy_position_xy: "[[1.864, -38.592], [10.610, -27.048], [-0.072, -23.976], [10.809, -9.827]]"
    buoy_marks: "[\"RED\", \"E\", \"W\", \"GREEN\"]"
    # GPS3 -> GPS4 bearing in the same ENU frame: 65.916 degrees.
    course_heading_rad: 1.1504545903685037
    # GPS3 starts the cardinal-wall stage.
    wall_retirement_start_xy: [5.403, -42.969]
    wall_radius: 2.5
    wall_points: 24
    goal_radius: 2.0
    waypoint_reach_radius: 2.0
    avoidance_eval_radius: 10.0
    avoidance_margin: 0.5
    # Testing override only: forces every marker (not just one) to this
    # buoy class, ignoring buoy_marks above. Leave empty for the
    # competition cardinal-mark slalom.
    forced_mark: ""

    # Visual bounds around every surveyed point. Cardinal walls themselves
    # are independently capped at 13 m by cardinal_wall_publisher.
    course_bounds: [-30.0, 30.0, -55.0, 15.0]
    # The KMZ has no physical divider; keep this legacy synthetic obstacle off.
    enable_center_line: false
    center_line: [0.0, 0.0, 0.0, 0.0]
    # Optional [min_x, max_x, min_y, max_y] blocker before marker detection.
    # Keep disabled by default because the full NavigateThroughPoses request
    # includes post-inference waypoints; blocking that area makes those goals
    # invalid before the route can start.
    pre_inference_block: "[]"
    obstacle_spacing: 0.25
    boundary_marker_step: 5.0

    seed: 2026
    publish_rate_hz: 2.0
