### Task3 simulation EKF: UM982 position + Livox IMU attitude/rate ###
# /odom is simulator ground truth. It drives the sensor simulators but is
# intentionally not a localization input.
ekf_filter_node_global:
  ros__parameters:
    frequency: 20.0
    two_d_mode: true
    publish_tf: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map
    print_diagnostics: true

    odom0: /odometry/gps/um982
    odom0_config: [true, true, false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    imu0: /livox/imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
