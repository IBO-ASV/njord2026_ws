# Parameters for `ros2 launch robot back_cam.launch.py`.
#
# Exposure and image controls are passed to the camera's V4L2 controls at
# startup. Adjust them to values supported by the connected camera, then
# restart the launch. Check the valid range with:
#   v4l2-ctl --device=/dev/videoN --list-ctrls
# For the Adesso CyberTrack H7, lower `exposure` makes the image darker and
# prevents highlight clipping. Start with 50 and adjust in the 1--5000 range.
/back_cam/back_cam:
  ros__parameters:
    # Keep the stable by-id path here. The launch file resolves it to the
    # current /dev/videoN path before passing it to usb_cam.
    video_device: /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._Adesso_CyberTrack_H7_SN0001-video-index0
    image_width: 640
    image_height: 480
    framerate: 30.0
    pixel_format: mjpeg2rgb
    camera_name: back_cam
    frame_id: back_cam_link
    brightness: 0
    contrast: 5
    gain: 0
    autoexposure: false
    exposure: 4000
