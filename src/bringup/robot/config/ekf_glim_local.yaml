### GLIM-backed local EKF: sole odom -> base_link authority ###
ekf_filter_node_glim_local:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    print_diagnostics: true

    # GLIM's TF is kept private. Its odometry topic is the continuous local
    # pose source, and this filter is the only odom -> base_link publisher.
    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 20
