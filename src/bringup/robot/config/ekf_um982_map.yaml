### UM982-backed global EKF: sole map -> odom authority ###
ekf_filter_node_um982_map:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map
    print_diagnostics: true

    # The companion launch configures the UM982 driver's first-fix local ENU
    # output with header.frame_id=map. Position and dual-antenna yaw estimate
    # map -> base_link; robot_localization combines that with the local EKF's
    # odom -> base_link TF and publishes map -> odom.
    odom0: /odometry/feedback
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
