alert_lamp_manager_node:
  ros__parameters:
    evaluation_rate_hz: 10.0
    # Canonical inputs.  The manager derives one alert state from these three
    # topics; no raw device heartbeat has a direct lamp output.
    inputs:
      control_state:
        topic: /control/state
        type: njord_interfaces/msg/ControlState
        purpose: "operating mode, E-stop, AUTO permission, inhibit reasons"
      mission_status:
        topic: /mission/status
        type: njord_interfaces/msg/MissionStatus
        purpose: "mission readiness while AUTO is requested"
      health_state:
        topic: /health/state
        type: njord_interfaces/msg/HealthState
        purpose: "vessel health summary"
    topics:
      control_state: /control/state
      mission_status: /mission/status
      health_state: /health/state
      alert_command: /alert_lamp/command

    # A state selects one named pattern below.  Pattern values are consumed by
    # alert_lamp_manager_node, so colours/timing can be changed without code.
    patterns:
      initializing:
        color: red
        mode: blink
        period_sec: 0.5
        duty_ratio: 0.5
        reason: "initializing: canonical state has not arrived"
      critical_fault:
        color: red
        mode: blink
        period_sec: 0.5
        duty_ratio: 0.5
        reason: "critical fault or unknown state"
      manual_normal:
        color: yellow
        mode: solid
        reason: "manual mode normal"
      auto_normal:
        color: green
        mode: solid
        reason: "automatic mode normal"
      autonomy_not_ready:
        color: green_yellow
        mode: blink
        period_sec: 1.0
        duty_ratio: 0.5
        reason: "AUTO requested but autonomy is not ready"
      ground_link_lost_auto:
        color: green_red
        mode: solid
        reason: "ground-station link lost in AUTO"
      ground_link_lost_manual:
        color: yellow_red
        mode: solid
        reason: "ground-station link lost in MANUAL"

    # Topic/message conditions that lead to each state and its pattern.
    # priority is the evaluator precedence (higher wins).  This section is a
    # human-readable contract; StatusEvaluator enforces the same precedence.
    topic_rules:
      critical_fault:
        pattern: critical_fault
        priority: 100
        conditions:
          - "/control/state.emergency_stop == true"
          - "/health/state.summary_state == ERROR"
          - "any canonical input is missing, UNKNOWN, or STALE"
      ground_link_lost_auto:
        pattern: ground_link_lost_auto
        priority: 80
        conditions:
          - "/control/state.inhibit_reason_codes contains INHIBIT_GROUND_STATION_UNAVAILABLE"
          - "/control/state.requested_mode == MODE_AUTO"
      ground_link_lost_manual:
        pattern: ground_link_lost_manual
        priority: 80
        conditions:
          - "/control/state.inhibit_reason_codes contains INHIBIT_GROUND_STATION_UNAVAILABLE"
          - "/control/state.requested_mode == MODE_MANUAL"
      autonomy_not_ready:
        pattern: autonomy_not_ready
        priority: 60
        conditions:
          - "/control/state.requested_mode == MODE_AUTO"
          - "/control/state.auto_permitted == false"
          - "/mission/status is waiting, validating, rejected, or failed"
          - "/health/state.summary_state == DEGRADED"
      auto_normal:
        pattern: auto_normal
        priority: 20
        conditions:
          - "/control/state.requested_mode == MODE_AUTO"
          - "/control/state.auto_permitted == true"
      manual_normal:
        pattern: manual_normal
        priority: 10
        conditions:
          - "/control/state.requested_mode == MODE_MANUAL"

alert_lamp_driver_node:
  ros__parameters:
    command_timeout_sec: 1.0
    # Existing micon_driver_fd/serial_writer owns USB serial and consumes these Bool topics.
    output_type: topic
    topics:
      alert_command: /alert_lamp/command
      green: /green
      yellow: /yellow
      red: /red
