# Task 1 route: old WP2-WP4 become WP1-WP3; WP4 extends WP3 by the old WP2->WP3
# local ENU vector. Yaw uses ROS ENU convention (radians, counter-clockwise
# from east) and follows each outgoing segment. The final WP keeps its incoming
# heading.

task1_config:
  frame_id: "odom"
  publish_rate_hz: 2.0
  waypoints: &task1_waypoints
    - {id: 1, competition_id: "1", latitude: 34.5456883, longitude: 135.5071568, yaw: 1.25724773, type: "start", name: "WP1", tolerance_m: 2.0}
    - {id: 2, competition_id: "2", latitude: 34.5457419, longitude: 135.5071779, yaw: 0.23405336, type: "waypoint", name: "WP2", tolerance_m: 2.0}
    - {id: 3, competition_id: "3", latitude: 34.5457571, longitude: 135.5072553, yaw: 1.25724773, type: "waypoint", name: "WP3", tolerance_m: 2.0}
    - {id: 4, competition_id: "4", latitude: 34.5458107, longitude: 135.5072764, yaw: 1.25724773, type: "goal", name: "WP4", tolerance_m: 2.0}
  constraints:
    follow_test: false
    route_pattern: "surveyed_maneuvering_and_path_finding"
    cardinal_marker_detection: true
    vision_halfway: false

# Deprecated compatibility route; it intentionally follows the same surveyed
# points so legacy displays keep loading valid coordinates.
task1_follow_config:
  frame_id: "odom"
  publish_rate_hz: 2.0
  waypoints: *task1_waypoints
  constraints:
    follow_test: true
