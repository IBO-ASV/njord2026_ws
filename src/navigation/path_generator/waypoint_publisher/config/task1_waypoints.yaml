# Task 1 route. Yaw uses ROS ENU convention (radians, counter-clockwise
# from east) and points from WP3 toward WP2 at every waypoint.

task1_config:
  frame_id: "odom"
  publish_rate_hz: 2.0
  waypoints: &task1_waypoints
    - {id: 1, competition_id: "1", latitude: 35.58489245725889, longitude: 139.6686519082559, yaw: 1.98993892, type: "start", name: "WP1", tolerance_m: 2.0}
    - {id: 2, competition_id: "2", latitude: 35.58500966000472, longitude: 139.66891393708406, yaw: 1.98993892, type: "waypoint", name: "WP2", tolerance_m: 2.0}
    - {id: 3, competition_id: "3", latitude: 35.58465094802953, longitude: 139.6691104587052, yaw: 1.98993892, type: "waypoint", name: "WP3", tolerance_m: 2.0}
    - {id: 4, competition_id: "4", latitude: 35.58464029319381, longitude: 139.6687043140215, yaw: 1.98993892, type: "goal", name: "WP4", tolerance_m: 2.0}
  constraints:
    follow_test: false
    route_pattern: "surveyed_maneuvering_and_path_finding"
    cardinal_marker_detection: true
    vision_halfway: false

# Deprecated compatibility route; it intentionally follows the same surveyed
# points so legacy displays keep loading valid coordinates.
task1_follow_config:
  frame_id: "odom"
  publish_rate_hz: 2.0
  waypoints: *task1_waypoints
  constraints:
    follow_test: true
