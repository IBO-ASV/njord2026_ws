# Task 1 route. Yaw uses ROS ENU convention (radians, counter-clockwise
# from east); the waypoint headings face north.

task1_config:
  frame_id: "odom"
  publish_rate_hz: 2.0
  waypoints: &task1_waypoints
    - {id: 1, competition_id: "1", latitude: 35.63469935771002, longitude: 139.8328640046391, yaw: 1.5707963267948966, type: "start", name: "WP1", tolerance_m: 2.0}
    - {id: 2, competition_id: "2", latitude: 35.63520510686516, longitude: 139.83302493717238, yaw: 1.5707963267948966, type: "waypoint", name: "WP2", tolerance_m: 2.0}
    - {id: 3, competition_id: "3", latitude: 35.63510046937149, longitude: 139.8325743260792, yaw: 1.5707963267948966, type: "waypoint", name: "WP3", tolerance_m: 2.0}
    - {id: 4, competition_id: "4", latitude: 35.63462959895471, longitude: 139.8330463948435, yaw: 1.5707963267948966, type: "waypoint", name: "WP4", tolerance_m: 2.0}
    - {id: 5, competition_id: "5", latitude: 35.63469935771002, longitude: 139.8328640046391, yaw: 1.5707963267948966, type: "goal", name: "WP5", tolerance_m: 2.0}
  constraints:
    follow_test: false
    route_pattern: "surveyed_maneuvering_and_path_finding"
    cardinal_marker_detection: true
    vision_halfway: false

# Deprecated compatibility route; it intentionally follows the same surveyed
# points so legacy displays keep loading valid coordinates.
task1_follow_config:
  frame_id: "odom"
  publish_rate_hz: 2.0
  waypoints: *task1_waypoints
  constraints:
    follow_test: true
