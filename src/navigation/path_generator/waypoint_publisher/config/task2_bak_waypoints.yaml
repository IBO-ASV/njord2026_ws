    - {id: waypoint2, latitude: 63.4406723313, longitude: 10.4230414139, yaw: -1.9634954085, type: "waypoint", name: "Waypoint 2 - Right 10 m", tolerance_m: 2.0}
    - {id: waypoint3, latitude: 63.4406175313, longitude: 10.4229642139, yaw: -1.9634954085, type: "waypoint", name: "Waypoint 3 - Right 10 m", tolerance_m: 2.0}
    - {id: waypoint4, latitude: 63.4405148000, longitude: 10.4230572000, yaw: -1.9634954085, type: "waypoint", name: "Waypoint 4", tolerance_m: 2.0}
    - {id: 6, latitude: 63.4404600000, longitude: 10.4229800000, yaw: -1.9634954085, type: "goal", name: "GPS 6 - Goal", tolerance_m: 2.0}

