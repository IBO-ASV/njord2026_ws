# Task 1 (follow test): Maneuvering and Path Finding
# Bathymetry-style lawnmower follow-test waypoint configuration for the test07089 pool.
#
# Selected via `task_type:=task1_follow`. Coexists with the competition `task1`
# waypoints (task1_waypoints.yaml) rather than replacing them.
#
# Pool rectangle reference points:
#   A: 35°40'03.0"N 139°47'37.9"E
#   B: 35°40'03.9"N 139°47'36.8"E
#   C: 35°40'03.3"N 139°47'36.1"E
#
# B is the right-angle corner within measurement accuracy. GPS points 1 and 2
# are placed near opposite corners of the usable survey area. The route is a
# lawnmower pattern: each long leg is about 25 m, then the ASV shifts sideways
# about 3.59 m before running the next leg in the opposite direction.

task1_follow_config:
  frame_id: "odom"
  publish_rate_hz: 2.0
  waypoints:
    - id: 1
      latitude: 35.6677242112
      longitude: 139.7935559245
      yaw: -0.7889
      type: "start"
      name: "GPS 1 - Survey Start"
      tolerance_m: 2.0

