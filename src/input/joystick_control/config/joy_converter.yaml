joy_converter:
  ros__parameters:
    axis:
      linear_x: 1
      linear_y: 0
    button:
      yaw_positive: 6
      yaw_negative: 7
      emergency: 0
      green: 1
      yellow: 2
      red: 3
      # Keep mode requests separate from the lamp buttons (yellow=2, red=3).
      manual_mode: 4
      auto_mode: 5
    scale:
      linear_x: 1.0
      linear_y: 1.0
      angular_z: 1.0
