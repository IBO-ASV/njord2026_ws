thruster_controller_node:
  ros__parameters:
    input_mode: "cmd_vel"       # cmd_vel or duty_array

    duty_resolution: 1000

    input_scaling:
      # Permit the AGX joystick's full-scale surge command of 3.0 m/s.
      max_linear_x: 3.0
      max_linear_y: 1.0
      max_angular_z: 1.0

    control:
      rate_hz: 50.0
      use_velocity_feedback: true
      feedback_timeout_sec: 0.5
      stop_on_feedback_timeout: true
      # Synthetic MMG coefficients; tune from real-vessel measurements.
      # The FF is always enabled. I_zG and J_z only affect acceleration,
      # and therefore are not used in this steady-state FF.
      #
      # u, v [m/s]: body surge and sway; r [rad/s]: yaw rate.
      # X, Y [N] and N [N m] are thruster force and yaw moment.
      # U = sqrt(u^2 + v^2 + 1e-6); rho = 1025 kg/m^3 (fixed in code).
      # Hull force/moment (the simulator's MMG equations):
      #   X_H = 0.5*rho*Lpp*D*u*U*R_0
      #   Y_H = 0.5*rho*Lpp*D*U^2*(Y_0 + Y_v*v/U + Y_r*r*Lpp/U)
      #   N_H = 0.5*rho*Lpp^2*D*U^2*(N_0 + N_v*v/U + N_r*r*Lpp/U)
      #
      # M * [du/dt, dv/dt, dr/dt]^T = [X, Y, N]^T + [X_H, Y_H, N_H]^T + C
      #       [mass_kg + m_x, 0,                 0                       ]
      #   M = [0,             mass_kg + m_y,     mass_kg*x_G             ]
      #       [0,             mass_kg*x_G,       I_zG + J_z + mass_kg*x_G^2]
      #   C = [(mass_kg+m_y)*v*r + mass_kg*x_G*r^2,
      #        -(mass_kg+m_x)*u*r, -mass_kg*x_G*u*r]^T
      #
      # Steady-state FF sets the acceleration vector to zero and evaluates
      # the following at the commanded u, v, r (not the measured velocity):
      #   X_FF = -X_H - (mass_kg+m_y)*v*r - mass_kg*x_G*r^2
      #   Y_FF = -Y_H + (mass_kg+m_x)*u*r
      #   N_FF = -N_H + mass_kg*x_G*u*r
      # PID velocity-error terms are added separately; no acceleration FF.
      mmg_ff:
        Lpp: 1.0
        D: 0.25
        mass_kg: 10.0
        I_zG: 1.5
        x_G: 0.0
        m_x: 1.0
        m_y: 10.0
        J_z: 1.5
        R_0: -0.2
        Y_0: 0.001
        Y_v: -0.2
        Y_r: 0.02
        N_0: 0.001
        N_v: -0.2
        N_r: -0.02
      p:
        surge: 28.29
        sway: 28.29
        yaw: 12.17
      # Feed-forward and measured-velocity D terms default to zero (legacy P/I behavior).
      ff:
        surge: 0.0
      d:
        surge: 0.0
        filter_tau_sec: 0.15
      # Wrench is clamped to +/-max_{surge,sway,yaw}_wrench instead of +/-1 so
      # stick/button-driven manual commands can reach a usable thrust; tuned so
      # manual_control.launch.py's default full-scale stick/button input
      # yields ~2N per thruster. See manual_bringup/README.md.
      max_surge_wrench: 145.7
      max_sway_wrench: 145.7
      max_yaw_wrench: 206.0
      dob:
        enable: false
        observer_gain: 1.0
        filter_tau_sec: 0.1
      nominal:
        mass: 24.0
        iz: 1.5
        damping:
          linear:
            surge: 0.2
            sway: 0.2
            yaw: 0.02
          quadratic:
            surge: 0.0
            sway: 0.0
            yaw: 0.0

    allocation:
      regularization_lambda: 1.0e-4
      # With the verified output order, allocated surge already matches the
      # ROS base_link +x convention. Keep sway and yaw positive too.
      # Order: [surge, sway, yaw].
      wrench_sign: [1.0, 1.0, 1.0]

    safety:
      watchdog_timeout_sec: 0.5
      # Zero disables this optional per-thruster force cap. Auto-tuning applies
      # a lower temporary cap and restores this configured value at stop.
      max_thruster_thrust_n: 0.0

    static_map:
      deadzone_pos: 0.0
      deadzone_neg: 0.0
      thrusters:
        forward_gain: [1.0, 1.0, 1.0, 1.0]
        reverse_gain: [1.0, 1.0, 1.0, 1.0]
        offset: [0.0, 0.0, 0.0, 0.0]

    # URDF stores only the fixed pose for these links. Direction, reverse and
    # output mapping stay here so wiring and prop orientation can be changed
    # without changing the robot model. The ESP32 command channel order was
    # verified with thruster_id_test as [RR, RL, FR, FL].
    thrusters:
      ids: ["RR", "RL", "FR", "FL"]
      links: ["thruster_RR", "thruster_RL", "thruster_FR", "thruster_FL"]
      angle_rad: [2.356194, -2.356194, 0.785398, -0.785398]
      reverse: [true, false, false, true]
      # BlueRobotics T200 @16V max thrust ~51.5N
      max_thrust: [100.0, 100.0, 100.0, 100.0]

    topics:
      cmd_vel: "cmd_vel"
      duty_array: "thruster_command"
      feedback_odometry: "/odometry/filtered/local"
      sim_thruster_command: "/thruster_command"
