bms_node:
  ros__parameters:
    topics:
      # Decoded by micon_driver_fd/bms_serial. Float32MultiArray[4], unit V.
      input: "micon/bms_cells"
      output: "bms/cell_voltages"
      temperature_input: "/micon/bms_temperature_c"
      temperature_output: "/bms/temperature_c"
      diagnostics: "/diagnostics"

    low_voltage:
      warning: 3.5
      error: 3.3

    battery:
      # Used only for the GUI's remaining-charge estimate. Tune for the pack chemistry.
      full_cell_voltage: 4.2
