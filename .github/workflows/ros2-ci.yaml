name: ROS 2 CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install static-check dependencies
        run: python -m pip install PyYAML pytest

      - name: Check diff whitespace
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="HEAD^"; fi
          git diff --check "$base...HEAD"

      - name: Validate changed structured files
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="HEAD^"; fi
          python .github/scripts/check_changed_files.py --base "$base"

      - name: Test hardware-free geometry and mission state logic
        env:
          PYTHONPATH: src/sim/njord_sim:src/mission/mission_manager
        run: >-
          python -m pytest -q
          src/sim/njord_sim/test
          src/mission/mission_manager/test/test_state_machine.py
          src/mission/mission_manager/test/test_readiness_evidence.py
          src/mission/mission_manager/test/test_geodesy_and_failsafe.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Mission GUI service and stale-state behavior
        run: node --test src/gui/foxglove_extensions/mission_control/test/panel.test.cjs

  core-simulation-build:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base-jammy
    env:
      # colcon must not discover robot's SDK/hardware exec_depends (e.g. zed2i_driver): it requires discovered deps to be built.
      CORE_PACKAGE_PATHS: >-
        src/njord_platform
        src/njord_interfaces
        src/detection/pcl_det
        src/detection/yolo
        src/navigation/path_generator/natural_cubic_spline
        src/navigation/path_generator/waypoint_publisher
        src/navigation/path_generator/catmull_rom
        src/navigation/buoy_obstacle_publisher
        src/diagnostics/diagnostic_monitors
        src/driver/micon/thruster_driver
        src/driver/micon/micon_driver_fd
        src/robot
        src/sim/dutyed_tf_pub_with_disturbance
        src/sim/sensor_sim_with_noise
        src/sim/operation_validator
        src/sim/task1_sim
        src/sim/task2_sim
        src/sim/task3_sim
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install build tools and package dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            python3-colcon-common-extensions \
            python3-rosdep
          rosdep update
          rosdep install --from-paths $CORE_PACKAGE_PATHS \
            --ignore-src --rosdistro humble -r -y

      - name: Build core simulation packages
        run: |
          source /opt/ros/humble/setup.bash
          source scripts/setup/njord_env.sh
          colcon build --event-handlers console_direct+ --paths $CORE_PACKAGE_PATHS

      - name: Test core simulation packages
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+ --paths $CORE_PACKAGE_PATHS --packages-select \
            njord_platform \
            dutyed_tf_pub_with_disturbance \
            operation_validator \
            task1_sim \
            task2_sim \
            task3_sim
          ROS_DOMAIN_ID=70 ROS_LOCALHOST_ONLY=1 RMW_IMPLEMENTATION=rmw_fastrtps_cpp \
            colcon test --event-handlers console_direct+ --paths $CORE_PACKAGE_PATHS \
            --packages-select robot micon_driver_fd --ctest-args -R "test_selective_heading_goal_checker|test_serial_writer"
          colcon test-result --verbose

  mission-simulation-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ros:jazzy-ros-base-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install CPU navigation and test dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            python3-colcon-common-extensions python3-pytest python3-yaml \
            python3-matplotlib python3-torch \
            ros-jazzy-navigation2 ros-jazzy-nav2-bringup \
            ros-jazzy-robot-localization ros-jazzy-geographic-msgs \
            ros-jazzy-diagnostic-updater

      - name: Build the hardware-free mission slice
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DBUILD_TESTING=OFF --paths \
            src/njord_interfaces src/robot src/alert_lamp \
            src/control/control_manager src/mission/mission_manager \
            src/mission/waypoint_transformer \
            src/navigation/path_generator/waypoint_publisher \
            src/navigation/path_generator/natural_cubic_spline \
            src/sim/task1_sim src/sim/task3_sim src/sim/njord_sim

      - name: Check mission semantics and opponent coordinate conversion
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          export PYTHONPATH="$PWD/src/navigation/path_generator/mppi:$PYTHONPATH"
          python3 -m pytest -q src/mission/mission_manager/test \
            src/control/control_manager/test src/sim/njord_sim/test \
            src/navigation/path_generator/mppi/test/test_opponent_cog.py \
            src/navigation/path_generator/mppi/test/test_path_guard.py \
            src/navigation/path_generator/mppi/test/test_path_permission.py

      - name: Exercise Mission, Nav2, arbitration, cancellation and zero output
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 scripts/simulation/run_mission_sim.py --task task3_1 \
            --cancel-after 25 --timeout 75 --output /tmp/mission-sim-smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-sim-smoke
          path: /tmp/mission-sim-smoke
