name: ROS 2 CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install static-check dependencies
        run: python -m pip install PyYAML

      - name: Check diff whitespace
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="HEAD^"; fi
          git diff --check "$base...HEAD"

      - name: Validate changed structured files
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="HEAD^"; fi
          python .github/scripts/check_changed_files.py --base "$base"

  actuator-profile-test:
    # Keep the three-wheel safety path independently testable.  The broader
    # simulation job also builds robot, whose optional runtime dependencies
    # are intentionally outside this actuator unit-test closure.
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install actuator test dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            python3-colcon-common-extensions \
            python3-rosdep
          rosdep update
          rosdep install --from-paths \
            src/driver/micon/micon_driver_fd \
            src/driver/micon/thruster_driver \
            --ignore-src --rosdistro humble --skip-keys xacro -r -y

      - name: Build actuator profiles
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+ --packages-select \
            micon_driver_fd \
            thruster_driver

      - name: Test actuator profiles
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+ --packages-select \
            micon_driver_fd \
            thruster_driver
          colcon test-result --verbose

  core-simulation-build:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install build tools and package dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            python3-colcon-common-extensions \
            python3-rosdep
          rosdep update
          rosdep install --from-paths \
            src/njord_platform \
            src/njord_interfaces \
            src/detection/pcl_det \
            src/detection/yolo \
            src/navigation/path_generator/natural_cubic_spline \
            src/navigation/path_generator/waypoint_publisher \
            src/navigation/path_generator/catmull_rom \
            src/navigation/buoy_obstacle_publisher \
            src/diagnostics/diagnostic_monitors \
            src/driver/micon/micon_driver_fd \
            src/driver/micon/thruster_driver \
            src/robot \
            src/sim/dutyed_tf_pub_with_disturbance \
            src/sim/sensor_sim_with_noise \
            src/sim/operation_validator \
            src/sim/task1_sim \
            src/sim/task2_sim \
            src/sim/task3_sim \
            --ignore-src --rosdistro humble -r -y

      - name: Build core simulation packages
        run: |
          source /opt/ros/humble/setup.bash
          source scripts/njord_env.sh
          # robot has in-workspace runtime dependencies.  Build the requested
          # packages with their source closure so its generated package.sh is
          # available instead of failing midway through the selected list.
          colcon build --event-handlers console_direct+ --packages-up-to \
            njord_platform \
            njord_interfaces \
            pcl_det \
            yolo \
            natural_cubic_spline \
            waypoint_publisher \
            catmull_rom_path_smoother \
            buoy_obstacle_publisher \
            diagnostic_monitors \
            micon_driver_fd \
            thruster_driver \
            robot \
            dutyed_tf_pub_with_disturbance \
            sensor_sim_with_noise \
            operation_validator \
            task1_sim \
            task2_sim \
            task3_sim

      - name: Run headless Task1 command-path smoke
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          smoke_log="$(mktemp)"
          python3 .github/scripts/task1_headless_smoke.py --timeout 45 >"${smoke_log}.probe" 2>&1 &
          probe_pid=$!
          # The simulator's thruster profile requires filtered local odometry.
          ros2 launch task1_sim task1_sim.launch.py \
            driver_delay:=0.0 \
            nav2_delay:=0.0 \
            goal_delay:=0.0 \
            use_nav2:=false \
            use_sensor_noise:=false \
            use_local_ekf:=true \
            use_global_ekf:=false \
            use_validator:=false \
            use_gui_dummy_publishers:=false \
            use_foxglove_bridge:=false \
            use_cardinal_perception_sim:=false >"${smoke_log}" 2>&1 &
          launch_pid=$!
          cleanup() {
            kill -INT "${launch_pid}" 2>/dev/null || true
            wait "${launch_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          if ! wait "${probe_pid}"; then
            cat "${smoke_log}.probe"
            cat "${smoke_log}"
            exit 1
          fi

      - name: Test core simulation packages
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+ --packages-select \
            njord_platform \
            micon_driver_fd \
            dutyed_tf_pub_with_disturbance \
            operation_validator \
            task1_sim \
            task2_sim \
            task3_sim
          colcon test-result --verbose
