behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    use_sim_time: false
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_nav_through_poses_bt_xml: ''
    default_nav_to_pose_bt_xml: ''
    default_server_timeout: 1000
    enable_stamped_cmd_vel: false
    global_frame: odom
    odom_topic: /odometry/filtered/local
    robot_base_frame: base_link
    use_sim_time: false
    wait_for_service_timeout: 2000
collision_monitor:
  ros__parameters:
    FootprintApproach:
      action_type: approach
      enabled: true
      footprint_topic: /local_costmap/published_footprint
      max_points: 3
      min_points: 3
      simulation_time_step: 0.1
      time_before_collision: 0.6
      type: polygon
      visualize: false
    base_frame_id: base_link
    base_shift_correction: false
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_nav
    enable_stamped_cmd_vel: false
    observation_sources:
    - physical
    odom_frame_id: odom
    physical:
      enabled: true
      max_height: 2.0
      min_height: -0.5
      topic: /sim_obstacles
      type: pointcloud
    polygons:
    - FootprintApproach
    sim_obstacles:
      enabled: true
      max_height: 2.0
      min_height: -0.5
      topic: /sim_obstacles
      type: pointcloud
      use_global_height: false
    source_timeout: 1.0
    state_topic: collision_monitor_state
    stop_pub_timeout: 2.0
    transform_tolerance: 0.2
    use_sim_time: false
    virtual_wall:
      enabled: true
      max_height: 2.0
      min_height: -0.5
      topic: /virtual_obstacles
      type: pointcloud
      use_global_height: false
controller_server:
  ros__parameters:
    FollowPath:
      approach_velocity_scaling_dist: 1.0
      cost_scaling_dist: 3.0
      desired_linear_vel: 0.8
      inflation_radius: 1.5
      lookahead_dist: 2.5
      lookahead_time: 2.0
      max_angular_accel: 0.35
      max_lookahead_dist: 4.0
      min_approach_linear_velocity: 0.05
      min_lookahead_dist: 1.5
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      rotate_to_heading_angular_vel: 0.4
      rotate_to_heading_at_start: false
      transform_tolerance: 0.1
      use_collision_detection: false
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: true
    controller_frequency: 15.0
    controller_plugins:
    - FollowPath
    enable_stamped_cmd_vel: false
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.7
      yaw_goal_tolerance: 6.28
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    progress_checker:
      movement_time_allowance: 45.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
    progress_checker_plugins:
    - progress_checker
    use_sim_time: false
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: '[[0.75,0.5],[0.75,-0.5],[-0.75,-0.5],[-0.75,0.5]]'
      footprint_padding: 0.1
      global_frame: odom
      height: 72
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 1.2
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        observation_sources: physical walls
        physical:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.2
          obstacle_max_range: 100.0
          raytrace_max_range: 100.0
          sensor_frame: base_link
          topic: /sim_obstacles
        plugin: nav2_costmap_2d::ObstacleLayer
        walls:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          obstacle_max_range: 100.0
          raytrace_max_range: 100.0
          sensor_frame: base_link
          topic: /virtual_obstacles
      origin_x: -42.099000000000004
      origin_y: -57.969
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.1
      robot_base_frame: base_link
      robot_radius: 0.8
      rolling_window: false
      track_unknown_space: false
      update_frequency: 5.0
      use_sim_time: false
      width: 80
lifecycle_manager:
  ros__parameters:
    autostart: true
    node_names:
    - controller_server
    - smoother_server
    - planner_server
    - behavior_server
    - bt_navigator
    - waypoint_follower
    - velocity_smoother
    - collision_monitor
    use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: '[[0.75,0.5],[0.75,-0.5],[-0.75,-0.5],[-0.75,0.5]]'
      footprint_padding: 0.1
      global_frame: odom
      height: 16
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 1.2
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        observation_sources: physical walls
        physical:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.2
          obstacle_max_range: 100.0
          raytrace_max_range: 100.0
          sensor_frame: base_link
          topic: /sim_obstacles
        plugin: nav2_costmap_2d::ObstacleLayer
        walls:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          obstacle_max_range: 100.0
          raytrace_max_range: 100.0
          sensor_frame: base_link
          topic: /virtual_obstacles
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.1
      robot_base_frame: base_link
      robot_radius: 0.8
      rolling_window: true
      update_frequency: 5.0
      use_sim_time: false
      width: 16
planner_server:
  ros__parameters:
    GridBased:
      how_many_corners: 8
      plugin: nav2_theta_star_planner::ThetaStarPlanner
      use_final_approach_orientation: false
      w_euc_cost: 1.0
      w_heuristic_cost: 1.0
      w_traversal_cost: 2.0
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    use_sim_time: false
smoother_server:
  ros__parameters:
    natural_cubic_spline:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - natural_cubic_spline
    use_sim_time: false
velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    feedback: OPEN_LOOP
    max_accel:
    - 0.5
    - 0.5
    - 0.7
    max_decel:
    - -0.5
    - -0.5
    - -0.7
    max_velocity:
    - 1.1
    - 0.5
    - 0.65
    min_velocity:
    - -0.5
    - -0.5
    - -0.65
    odom_duration: 0.1
    odom_topic: /odom
    smoothing_frequency: 20.0
    use_sim_time: false
waypoint_follower:
  ros__parameters:
    use_sim_time: false
