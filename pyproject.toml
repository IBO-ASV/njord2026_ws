[project]
name = "njord2026-ws"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "certifi==2025.11.12",
    "charset-normalizer==3.4.4",
    "contourpy==1.3.2",
    "cycler==0.12.1",
    "filelock==3.20.0",
    "fonttools==4.61.0",
    "fsspec==2025.12.0",
    "idna==3.11",
    "jinja2==3.1.6",
    "kiwisolver==1.4.9",
    "markupsafe==3.0.3",
    "matplotlib==3.10.8",
    "mpmath==1.3.0",
    "networkx==3.4.2",
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "packaging==25.0",
    "pillow==12.0.0",
    "polars==1.36.1",
    "polars-runtime-32==1.36.1",
    "psutil==7.1.3",
    "pyparsing==3.2.5",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "scipy==1.15.3",
    "six==1.17.0",
    "sympy==1.14.0",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "typeguard==4.4.4",
    "typing-extensions==4.15.0",
    "ultralytics==8.3.237",
    "ultralytics-thop==2.0.18",
    "urllib3==2.6.2",
]

# CPU/ROS simulation remains available without downloading desktop CUDA wheels
# on ARM64. JetPack 7.2 uses the official CUDA 13 PyTorch index explicitly.
[project.optional-dependencies]
cpu = ["torch==2.9.1", "torchvision==0.24.1"]
jetson = ["torch==2.9.1", "torchvision==0.24.1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "jetson" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu130", extra = "jetson" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu130", extra = "jetson" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
