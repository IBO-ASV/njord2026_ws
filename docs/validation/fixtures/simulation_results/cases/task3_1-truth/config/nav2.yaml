amcl:
  ros__parameters:
    enabled: false
behavior_server:
  ros__parameters:
    backup:
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - backup
    - wait
    - drive_on_heading
    costmap_topic: local_costmap/costmap_raw
    cycle_frequency: 20.0
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    enable_stamped_cmd_vel: false
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    use_sim_time: false
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_nav_through_poses_bt_xml: ''
    default_nav_to_pose_bt_xml: ''
    default_server_timeout: 1000
    enable_stamped_cmd_vel: false
    global_frame: odom
    odom_topic: /odometry/filtered/local
    replanning_frequency: 5.0
    robot_base_frame: base_link
    use_sim_time: false
    wait_for_service_timeout: 2000
collision_monitor:
  ros__parameters:
    FootprintApproach:
      action_type: approach
      enabled: true
      footprint_topic: /local_costmap/published_footprint
      max_points: 3
      min_points: 3
      simulation_time_step: 0.1
      time_before_collision: 0.6
      type: polygon
      visualize: false
    base_frame_id: base_link
    base_shift_correction: false
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_nav
    enable_stamped_cmd_vel: false
    observation_sources:
    - physical
    odom_frame_id: odom
    physical:
      enabled: true
      max_height: 2.0
      min_height: -0.5
      topic: /sim_obstacles
      type: pointcloud
    pointcloud:
      enabled: true
      max_height: 2.0
      min_height: -0.5
      topic: /pointcloud
      type: pointcloud
      use_global_height: false
    polygons:
    - FootprintApproach
    source_timeout: 1.0
    state_topic: collision_monitor_state
    stop_pub_timeout: 2.0
    transform_tolerance: 0.2
    use_sim_time: false
controller_server:
  ros__parameters:
    FollowPath:
      BaseObstacle.scale: 0.02
      GoalDist.scale: 24.0
      PathDist.scale: 32.0
      RotateToGoal.lookahead_time: -1.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      acc_lim_theta: 0.7
      acc_lim_x: 0.5
      acc_lim_y: 0.5
      angular_granularity: 0.05
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - PathDist
      - GoalDist
      debug_trajectory_details: false
      decel_lim_theta: -0.7
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      linear_granularity: 0.05
      max_speed_xy: 0.5
      max_vel_theta: 0.35
      max_vel_x: 0.5
      max_vel_y: 0.5
      min_speed_theta: 0.0
      min_speed_xy: 0.0
      min_vel_x: -0.5
      min_vel_y: -0.5
      plugin: dwb_core::DWBLocalPlanner
      short_circuit_trajectory_evaluation: true
      sim_time: 1.5
      stateful: true
      trans_stopped_velocity: 0.05
      transform_tolerance: 0.3
      vtheta_samples: 9
      vx_samples: 11
      vy_samples: 11
      xy_goal_tolerance: 0.15
    controller_frequency: 15.0
    controller_plugins:
    - FollowPath
    enable_stamped_cmd_vel: false
    general_goal_checker:
      heading_required_goal_tolerance: 1.0
      heading_required_goal_xs:
      - 13.863062706390755
      - 15.44954843878843
      heading_required_goal_ys:
      - -4.644499716910175
      - -3.9013645599955833
      plugin: robot::SelectiveHeadingGoalChecker
      position_only_xy_goal_tolerance: 1.5
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.08726646259971647
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    progress_checker:
      movement_time_allowance: 45.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
    progress_checker_plugin: progress_checker
    progress_checker_plugins:
    - progress_checker
    use_sim_time: false
global_costmap:
  global_costmap:
    ros__parameters:
      field_boundary_layer:
        map_subscribe_transient_local: true
        map_topic: /field_boundary_costmap
        plugin: nav2_costmap_2d::StaticLayer
        subscribe_to_updates: false
      footprint: '[[0.75,0.5],[0.75,-0.5],[-0.75,-0.5],[-0.75,0.5]]'
      footprint_padding: 0.1
      global_frame: odom
      height: 44
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 1.2
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        observation_sources: physical walls
        physical:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.2
          obstacle_max_range: 100.0
          raytrace_max_range: 100.0
          sensor_frame: base_link
          topic: /sim_obstacles
        plugin: nav2_costmap_2d::ObstacleLayer
        walls:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          obstacle_max_range: 100.0
          raytrace_max_range: 100.0
          sensor_frame: base_link
          topic: /virtual_obstacles
      origin_x: -15.0
      origin_y: -29.243189081239905
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.1
      robot_base_frame: base_link
      robot_radius: 0.35
      rolling_window: false
      track_unknown_space: false
      update_frequency: 5.0
      use_sim_time: false
      width: 45
lifecycle_manager:
  ros__parameters:
    autostart: true
    node_names:
    - controller_server
    - smoother_server
    - planner_server
    - behavior_server
    - bt_navigator
    - waypoint_follower
    - velocity_smoother
    - collision_monitor
    use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: '[[0.75,0.5],[0.75,-0.5],[-0.75,-0.5],[-0.75,0.5]]'
      footprint_padding: 0.1
      global_frame: odom
      height: 16
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 1.2
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        observation_sources: physical walls
        physical:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.2
          obstacle_max_range: 100.0
          raytrace_max_range: 100.0
          sensor_frame: base_link
          topic: /sim_obstacles
        plugin: nav2_costmap_2d::ObstacleLayer
        walls:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          obstacle_max_range: 100.0
          raytrace_max_range: 100.0
          sensor_frame: base_link
          topic: /virtual_obstacles
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.1
      robot_base_frame: base_link
      robot_radius: 0.35
      rolling_window: true
      update_frequency: 5.0
      use_sim_time: false
      width: 16
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
planner_server:
  ros__parameters:
    GridBased:
      how_many_corners: 8
      plugin: nav2_theta_star_planner::ThetaStarPlanner
      use_final_approach_orientation: false
      w_euc_cost: 1.0
      w_heuristic_cost: 1.0
      w_traversal_cost: 2.0
    expected_planner_frequency: 10.0
    planner_plugins:
    - GridBased
    use_sim_time: false
smoother_server:
  ros__parameters:
    natural_cubic_spline:
      control_point_spacing: 0.5
      path_point_spacing: 0.1
      plugin: natural_cubic_spline::NaturalCubicSplineSmoother
    smoother_plugins:
    - natural_cubic_spline
    use_sim_time: false
velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    feedback: OPEN_LOOP
    max_accel:
    - 0.5
    - 0.5
    - 0.7
    max_decel:
    - -0.5
    - -0.5
    - -0.7
    max_velocity:
    - 1.1
    - 0.5
    - 0.65
    min_velocity:
    - -0.5
    - -0.5
    - -0.65
    odom_topic: /odometry/filtered/local
    smoothing_frequency: 50.0
    use_sim_time: false
